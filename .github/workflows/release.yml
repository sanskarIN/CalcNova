name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Normalized semantic version tag, for example v2.8.3 (product display version 2.8.03)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate requested release tag syntax
        run: python tools/validate_release_tag.py "$RELEASE_TAG"

      - name: Verify and checkout release tag
        shell: bash
        run: |
          git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          git checkout --detach "$RELEASE_TAG"

      - name: Verify tag matches source package version
        shell: bash
        run: |
          SOURCE_VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          test -n "$SOURCE_VERSION"
          test "$RELEASE_TAG" = "v$SOURCE_VERSION"

      - name: Run tagged source preflight
        run: python tools/release_preflight.py --tag "$RELEASE_TAG"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore core solution
        run: dotnet restore CalcNova.slnx

      - name: Verify formatting
        run: dotnet format CalcNova.slnx --verify-no-changes --no-restore

      - name: Build core solution
        run: dotnet build CalcNova.slnx --configuration Release --no-restore

      - name: Test core solution
        run: dotnet test CalcNova.slnx --configuration Release --no-build

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Publish desktop
        run: dotnet publish src/CalcNova.Desktop/CalcNova.Desktop.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output publish/${{ matrix.rid }}
      - name: Generate desktop CycloneDX SBOM
        run: python tools/generate_sbom.py --assets src/CalcNova.Desktop/obj/project.assets.json --name CalcNova-${{ matrix.rid }} --output CalcNova-${{ matrix.rid }}.sbom.cdx.json
      - name: Archive desktop artifact
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "CalcNova-${{ matrix.rid }}.zip"
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.rid }}
          path: |
            CalcNova-${{ matrix.rid }}.zip
            CalcNova-${{ matrix.rid }}.sbom.cdx.json
          if-no-files-found: error

  browser:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Publish Browser
        run: dotnet publish src/CalcNova.Browser/CalcNova.Browser.csproj --configuration Release --output publish/browser
      - name: Generate Browser CycloneDX SBOM
        run: python tools/generate_sbom.py --assets src/CalcNova.Browser/obj/project.assets.json --name CalcNova-browser --output CalcNova-browser.sbom.cdx.json
      - name: Archive Browser artifact
        shell: pwsh
        run: Compress-Archive -Path "publish/browser/*" -DestinationPath "CalcNova-browser.zip"
      - name: Upload Browser artifact
        uses: actions/upload-artifact@v7
        with:
          name: browser
          path: |
            CalcNova-browser.zip
            CalcNova-browser.sbom.cdx.json
          if-no-files-found: error

  android:
    needs: validate
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.CALCNOVA_ANDROID_KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.CALCNOVA_ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.CALCNOVA_ANDROID_KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.CALCNOVA_ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android workload
        run: dotnet workload install android
      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" && -n "$STORE_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Android release artifact skipped because signing secrets are not configured."
          fi
      - name: Decode temporary keystore
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/calcnova-release.keystore"
      - name: Publish signed Android App Bundle
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          dotnet publish src/CalcNova.Android/CalcNova.Android.csproj \
            --configuration Release \
            -p:AndroidPackageFormats=aab \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/calcnova-release.keystore" \
            -p:AndroidSigningKeyAlias="$KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$KEY_PASSWORD" \
            -p:AndroidSigningStorePass="$STORE_PASSWORD"
          AAB="$(find src/CalcNova.Android/bin/Release -type f -name '*.aab' | head -n 1)"
          test -n "$AAB"
          cp "$AAB" CalcNova-android.aab
      - name: Generate Android CycloneDX SBOM
        if: steps.signing.outputs.configured == 'true'
        run: python tools/generate_sbom.py --assets src/CalcNova.Android/obj/project.assets.json --name CalcNova-android --output CalcNova-android.sbom.cdx.json
      - name: Upload Android artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            CalcNova-android.aab
            CalcNova-android.sbom.cdx.json
          if-no-files-found: error
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/calcnova-release.keystore"

  publish-release:
    needs: [desktop, browser, android]
    if: always() && needs.desktop.result == 'success' && needs.browser.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Validate release asset filenames
        shell: bash
        run: |
          mapfile -t duplicate_names < <(find release-assets -type f -printf '%f\n' | sort | uniq -d)
          if ((${#duplicate_names[@]} > 0)); then
            echo "Duplicate release asset filenames are not allowed:" >&2
            printf '%s\n' "${duplicate_names[@]}" >&2
            exit 1
          fi

          if find release-assets -type f -name 'SHA256SUMS.txt' -print -quit | grep -q .; then
            echo "SHA256SUMS.txt is a reserved release asset filename." >&2
            exit 1
          fi

          test -n "$(find release-assets -type f -print -quit)"
      - name: Generate checksums
        shell: bash
        run: |
          : > SHA256SUMS.txt
          while IFS= read -r -d '' file; do
            digest="$(sha256sum "$file" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$digest" "$(basename "$file")" >> SHA256SUMS.txt
          done < <(find release-assets -type f -print0 | sort -z)
          cp SHA256SUMS.txt release-assets/SHA256SUMS.txt
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: release-assets/**/*
      - name: Create or reuse GitHub Release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; preserving its notes and replacing packaged assets only."
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi

          while IFS= read -r -d '' file; do
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done < <(find release-assets -type f -print0)
