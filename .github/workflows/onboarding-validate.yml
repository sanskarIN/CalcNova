name: Onboarding Validate

on:
  push:
    branches: [main]
    paths:
      - "src/CalcNova.Platform/Settings/AppSettings.cs"
      - "src/CalcNova.App/Infrastructure/OnboardingPolicy.cs"
      - "src/CalcNova.App/ViewModels/SettingsViewModel.cs"
      - "tests/CalcNova.App.Tests/OnboardingPolicyTests.cs"
      - "tests/CalcNova.App.Tests/SettingsOnboardingViewModelTests.cs"
      - "tools/validate_onboarding_contracts.py"
      - "docs/ONBOARDING.md"
      - ".github/workflows/onboarding-validate.yml"
  pull_request:
    paths:
      - "src/CalcNova.Platform/Settings/AppSettings.cs"
      - "src/CalcNova.App/Infrastructure/OnboardingPolicy.cs"
      - "src/CalcNova.App/ViewModels/SettingsViewModel.cs"
      - "tests/CalcNova.App.Tests/OnboardingPolicyTests.cs"
      - "tests/CalcNova.App.Tests/SettingsOnboardingViewModelTests.cs"
      - "tools/validate_onboarding_contracts.py"
      - "docs/ONBOARDING.md"
      - ".github/workflows/onboarding-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate onboarding contracts
        run: python tools/validate_onboarding_contracts.py .
