name: Unicode Metadata Validate

on:
  push:
    branches: [main]
    paths:
      - "src/CalcNova.Programmer/UnicodeScalarMetadata.cs"
      - "src/CalcNova.Programmer/UnicodeCodePointHelper.cs"
      - "src/CalcNova.App/ViewModels/CodePointViewModel.cs"
      - "src/CalcNova.App/Controls/CodePointMetadataPanel.cs"
      - "src/CalcNova.App/Views/MainView.axaml.cs"
      - "tests/CalcNova.Programmer.Tests/UnicodeScalarMetadataTests.cs"
      - "tests/CalcNova.App.Tests/CodePointMetadataViewModelTests.cs"
      - "tests/CalcNova.App.Tests/CodePointMetadataPanelHeadlessTests.cs"
      - "tools/validate_unicode_metadata.py"
      - "tools/tests/test_validate_unicode_metadata.py"
      - ".github/workflows/unicode-metadata-validate.yml"
  pull_request:
    paths:
      - "src/CalcNova.Programmer/UnicodeScalarMetadata.cs"
      - "src/CalcNova.Programmer/UnicodeCodePointHelper.cs"
      - "src/CalcNova.App/ViewModels/CodePointViewModel.cs"
      - "src/CalcNova.App/Controls/CodePointMetadataPanel.cs"
      - "src/CalcNova.App/Views/MainView.axaml.cs"
      - "tests/CalcNova.Programmer.Tests/UnicodeScalarMetadataTests.cs"
      - "tests/CalcNova.App.Tests/CodePointMetadataViewModelTests.cs"
      - "tests/CalcNova.App.Tests/CodePointMetadataPanelHeadlessTests.cs"
      - "tools/validate_unicode_metadata.py"
      - "tools/tests/test_validate_unicode_metadata.py"
      - ".github/workflows/unicode-metadata-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unicode-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate local Unicode metadata contracts
        run: python tools/validate_unicode_metadata.py .

      - name: Run Unicode metadata validator tests
        run: python -m unittest tools.tests.test_validate_unicode_metadata
