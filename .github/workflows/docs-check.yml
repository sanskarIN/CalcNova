name: Documentation Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify mandatory repository documents
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md LICENSE CHANGELOG.md CONTRIBUTING.md CODE_OF_CONDUCT.md
            SECURITY.md SUPPORT.md PROJECT_STATE.md what_changed.md
            docs/ARCHITECTURE.md docs/BUILDING.md docs/CALCULATION_ENGINE.md
            docs/FEATURES.md docs/KEYBOARD_SHORTCUTS.md docs/ACCESSIBILITY.md
            docs/PRIVACY.md docs/SECURITY.md docs/TESTING.md docs/RELEASE.md
            docs/PLATFORM_SUPPORT.md docs/TROUBLESHOOTING.md docs/DESIGN_SYSTEM.md
            docs/LOCALIZATION.md docs/ROADMAP.md docs/SOURCE_PREFLIGHT.md
            docs/BRANCH_PROTECTION.md docs/SECURITY_AUTOMATION.md
            docs/ARTIFACT_PROVENANCE.md docs/CI_HYGIENE.md
            docs/VALIDATION_EVIDENCE.md docs/RELEASE_READINESS_CHECKLIST.md
          )
          missing=0
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing or empty required file: $file"
              missing=1
            fi
          done
          exit "$missing"

      - name: Reject common unresolved release placeholders in docs
        shell: bash
        run: |
          set -euo pipefail
          # A marker written as inline code is being named, not left behind - the
          # documentation has to be able to describe the placeholder policy, and the
          # historical records describe the validator that enforces it. Strip code spans
          # first, then scan what remains.
          status=0
          while IFS= read -r file; do
            if matches=$(sed 's/`[^`]*`//g' "$file" | grep -nE '(^|[^A-Za-z])(TBD|FIXME|HACK|XXX)([^A-Za-z]|$)'); then
              printf '%s\n' "$matches" | sed "s|^|$file:|"
              status=1
            fi
          done < <(find README.md docs -type f -name '*.md' | sort)
          if [[ "$status" -ne 0 ]]; then
            echo "Documentation contains unresolved placeholder markers."
          fi
          exit "$status"
