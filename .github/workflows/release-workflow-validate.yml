name: Release Workflow Validate

on:
  push:
    paths:
      - '.github/workflows/release.yml'
      - 'tools/release_preflight.py'
      - 'tools/validate_release_workflow.py'
      - 'tools/tests/test_validate_release_workflow.py'
      - 'docs/RELEASE.md'
      - '.github/workflows/release-workflow-validate.yml'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'tools/release_preflight.py'
      - 'tools/validate_release_workflow.py'
      - 'tools/tests/test_validate_release_workflow.py'
      - 'docs/RELEASE.md'
      - '.github/workflows/release-workflow-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-workflow-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate release workflow source contract
        run: python tools/validate_release_workflow.py

      - name: Run release workflow validator tests
        run: python -m unittest tools.tests.test_validate_release_workflow
