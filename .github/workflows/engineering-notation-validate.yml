name: Engineering Notation Validate

on:
  push:
    branches: [main]
    paths:
      - "src/CalcNova.Core/Numerics/EngineeringNotationFormatter.cs"
      - "tests/CalcNova.Core.Tests/EngineeringNotationFormatterTests.cs"
      - "tools/validate_engineering_notation.py"
      - "tools/tests/test_validate_engineering_notation.py"
      - ".github/workflows/engineering-notation-validate.yml"
  pull_request:
    paths:
      - "src/CalcNova.Core/Numerics/EngineeringNotationFormatter.cs"
      - "tests/CalcNova.Core.Tests/EngineeringNotationFormatterTests.cs"
      - "tools/validate_engineering_notation.py"
      - "tools/tests/test_validate_engineering_notation.py"
      - ".github/workflows/engineering-notation-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering-notation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate engineering notation contracts
        run: python tools/validate_engineering_notation.py .

      - name: Run engineering notation validator tests
        run: python -m unittest tools.tests.test_validate_engineering_notation
