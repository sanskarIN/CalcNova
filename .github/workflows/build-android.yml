name: Android Build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Directory.*.props"
      - "global.json"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "Directory.*.props"
      - "global.json"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: dotnet restore src/CalcNova.Android/CalcNova.Android.csproj

      - name: Build Android release configuration
        run: dotnet build src/CalcNova.Android/CalcNova.Android.csproj --configuration Release --no-restore

      - name: Package Android app bundle
        run: dotnet publish src/CalcNova.Android/CalcNova.Android.csproj --configuration Release --no-restore --output artifacts/android

      - name: Confirm both distribution shapes were produced
        shell: bash
        run: |
          set -euo pipefail
          # A compile proves the code is valid; only packaging proves the manifest, resources and
          # signing configuration hold together, which is what distribution actually needs.
          # The release publishes both shapes, so both have to be proven here rather than in the
          # one workflow run that cannot be repeated.
          bundle=$(find artifacts/android -name '*.aab' -print -quit)
          if [[ -z "$bundle" ]]; then
            echo "No Android app bundle was produced."
            find artifacts/android -maxdepth 2 -type f -print
            exit 1
          fi
          echo "Produced $bundle ($(du -h "$bundle" | cut -f1))"

          apk=$(find artifacts/android -name '*-Signed.apk' -print -quit)
          if [[ -z "$apk" ]]; then
            echo "No universal APK was derived from the app bundle."
            find artifacts/android -maxdepth 2 -type f -print
            exit 1
          fi
          echo "Produced $apk ($(du -h "$apk" | cut -f1))"

      - name: Upload Android packages
        uses: actions/upload-artifact@v7
        with:
          name: calcnova-android-packages
          path: |
            artifacts/android/*.aab
            artifacts/android/*-Signed.apk
          if-no-files-found: error
          retention-days: 14
