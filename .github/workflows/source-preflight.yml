name: Source Preflight

on:
  push:
    branches: [main]
    paths:
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "CalcNova.slnx"
      - "CalcNova.All.slnx"
      - ".gitignore"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "packaging/**"
      - "docs/**"
      - ".github/workflows/**"
      - "README.md"
      - "CHANGELOG.md"
      - "PROJECT_STATE.md"
      - "what_changed.md"
  pull_request:
    paths:
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "CalcNova.slnx"
      - "CalcNova.All.slnx"
      - ".gitignore"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "packaging/**"
      - "docs/**"
      - ".github/workflows/**"
      - "README.md"
      - "CHANGELOG.md"
      - "PROJECT_STATE.md"
      - "what_changed.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run integrated source preflight
        run: python tools/release_preflight.py
