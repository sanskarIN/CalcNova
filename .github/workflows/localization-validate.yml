name: Localization Validate

on:
  push:
    branches: [main]
    paths:
      - "src/CalcNova.App/Localization/**"
      - "src/CalcNova.App/Services/AppDependencies.cs"
      - "src/CalcNova.App/ViewModels/MainViewModel.cs"
      - "src/CalcNova.App/ViewModels/SettingsViewModel.cs"
      - "src/CalcNova.App/Views/MainView.axaml"
      - "src/CalcNova.App/Views/MainView.axaml.cs"
      - "src/CalcNova.Platform/Settings/AppSettings.cs"
      - "src/CalcNova.Persistence/Settings/JsonSettingsRepository.cs"
      - "src/CalcNova.Browser/Services/BrowserSettingsRepository.cs"
      - "tests/CalcNova.App.Tests/AppLocalizerTests.cs"
      - "tests/CalcNova.App.Tests/ShellLocalizationTests.cs"
      - "tests/CalcNova.App.Tests/MainViewHeadlessTests.cs"
      - "tests/CalcNova.App.Tests/MainViewModelLocalizationTests.cs"
      - "tests/CalcNova.App.Tests/SettingsLocalizationViewModelTests.cs"
      - "tests/CalcNova.Persistence.Tests/JsonSettingsRepositoryTests.cs"
      - "tools/validate_localization_catalog.py"
      - "tools/tests/test_validate_localization_catalog.py"
      - "docs/LOCALIZATION.md"
      - ".github/workflows/localization-validate.yml"
  pull_request:
    paths:
      - "src/CalcNova.App/Localization/**"
      - "src/CalcNova.App/Services/AppDependencies.cs"
      - "src/CalcNova.App/ViewModels/MainViewModel.cs"
      - "src/CalcNova.App/ViewModels/SettingsViewModel.cs"
      - "src/CalcNova.App/Views/MainView.axaml"
      - "src/CalcNova.App/Views/MainView.axaml.cs"
      - "src/CalcNova.Platform/Settings/AppSettings.cs"
      - "src/CalcNova.Persistence/Settings/JsonSettingsRepository.cs"
      - "src/CalcNova.Browser/Services/BrowserSettingsRepository.cs"
      - "tests/CalcNova.App.Tests/AppLocalizerTests.cs"
      - "tests/CalcNova.App.Tests/ShellLocalizationTests.cs"
      - "tests/CalcNova.App.Tests/MainViewHeadlessTests.cs"
      - "tests/CalcNova.App.Tests/MainViewModelLocalizationTests.cs"
      - "tests/CalcNova.App.Tests/SettingsLocalizationViewModelTests.cs"
      - "tests/CalcNova.Persistence.Tests/JsonSettingsRepositoryTests.cs"
      - "tools/validate_localization_catalog.py"
      - "tools/tests/test_validate_localization_catalog.py"
      - "docs/LOCALIZATION.md"
      - ".github/workflows/localization-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-localization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate localization catalogs and live shell wiring
        run: python tools/validate_localization_catalog.py .

      - name: Run localization validator regression tests
        run: python -m unittest tools.tests.test_validate_localization_catalog
