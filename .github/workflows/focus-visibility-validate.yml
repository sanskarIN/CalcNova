name: Focus Visibility Validate

on:
  push:
    paths:
      - 'src/CalcNova.App/App.axaml'
      - 'tools/validate_focus_visibility.py'
      - 'tools/tests/test_validate_focus_visibility.py'
      - '.github/workflows/focus-visibility-validate.yml'
  pull_request:
    paths:
      - 'src/CalcNova.App/App.axaml'
      - 'tools/validate_focus_visibility.py'
      - 'tools/tests/test_validate_focus_visibility.py'
      - '.github/workflows/focus-visibility-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focus-visibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate focus visibility contracts
        run: python tools/validate_focus_visibility.py

      - name: Run focus visibility validator tests
        run: python -m unittest tools.tests.test_validate_focus_visibility
