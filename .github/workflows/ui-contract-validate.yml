name: UI Contract Validate

on:
  push:
    branches: [main]
    paths:
      - "src/CalcNova.App/App.axaml"
      - "src/CalcNova.App/Infrastructure/AdaptiveLayoutProfile.cs"
      - "src/CalcNova.App/Infrastructure/CalculatorKeyboardInput.cs"
      - "src/CalcNova.App/Views/MainView.axaml"
      - "src/CalcNova.App/Views/MainView.axaml.cs"
      - "src/CalcNova.App/ViewModels/**"
      - "tests/CalcNova.App.Tests/AdaptiveLayoutProfileTests.cs"
      - "tests/CalcNova.App.Tests/CalculatorKeyboardInputTests.cs"
      - "tests/CalcNova.App.Tests/MainViewModelNavigationTests.cs"
      - "tools/validate_keyboard_contracts.py"
      - "tools/validate_navigation_contracts.py"
      - "tools/validate_ui_contracts.py"
      - "tools/validate_xaml.py"
      - ".github/workflows/ui-contract-validate.yml"
  pull_request:
    paths:
      - "src/CalcNova.App/App.axaml"
      - "src/CalcNova.App/Infrastructure/AdaptiveLayoutProfile.cs"
      - "src/CalcNova.App/Infrastructure/CalculatorKeyboardInput.cs"
      - "src/CalcNova.App/Views/MainView.axaml"
      - "src/CalcNova.App/Views/MainView.axaml.cs"
      - "src/CalcNova.App/ViewModels/**"
      - "tests/CalcNova.App.Tests/AdaptiveLayoutProfileTests.cs"
      - "tests/CalcNova.App.Tests/CalculatorKeyboardInputTests.cs"
      - "tests/CalcNova.App.Tests/MainViewModelNavigationTests.cs"
      - "tools/validate_keyboard_contracts.py"
      - "tools/validate_navigation_contracts.py"
      - "tools/validate_ui_contracts.py"
      - "tools/validate_xaml.py"
      - ".github/workflows/ui-contract-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-shared-ui-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Avalonia XAML XML
        run: python tools/validate_xaml.py .

      - name: Validate shared UI contracts
        run: python tools/validate_ui_contracts.py .

      - name: Validate shared navigation contracts
        run: python tools/validate_navigation_contracts.py .

      - name: Validate calculator keyboard contracts
        run: python tools/validate_keyboard_contracts.py .
