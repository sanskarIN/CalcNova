name: Security Automation Validate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/codeql.yml"
      - ".github/workflows/dependency-review.yml"
      - ".github/workflows/security-automation-validate.yml"
      - "tools/validate_security_workflows.py"
      - "tools/tests/test_validate_security_workflows.py"
      - "tools/release_preflight.py"
      - "tools/tests/test_release_preflight.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/codeql.yml"
      - ".github/workflows/dependency-review.yml"
      - ".github/workflows/security-automation-validate.yml"
      - "tools/validate_security_workflows.py"
      - "tools/tests/test_validate_security_workflows.py"
      - "tools/release_preflight.py"
      - "tools/tests/test_release_preflight.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate security workflows
        run: python tools/validate_security_workflows.py .

      - name: Run security workflow validator tests
        run: python -m unittest tools.tests.test_validate_security_workflows
