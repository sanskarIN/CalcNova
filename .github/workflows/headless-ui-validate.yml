name: Headless UI Validate

on:
  push:
    branches: [main]
    paths:
      - 'Directory.Packages.props'
      - 'src/CalcNova.App/**'
      - 'tests/CalcNova.App.Tests/**'
      - 'tools/validate_headless_ui_tests.py'
      - 'tools/tests/test_validate_headless_ui_tests.py'
      - '.github/workflows/headless-ui-validate.yml'
  pull_request:
    paths:
      - 'Directory.Packages.props'
      - 'src/CalcNova.App/**'
      - 'tests/CalcNova.App.Tests/**'
      - 'tools/validate_headless_ui_tests.py'
      - 'tools/tests/test_validate_headless_ui_tests.py'
      - '.github/workflows/headless-ui-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate headless UI source contracts
        run: python tools/validate_headless_ui_tests.py

      - name: Run headless UI validator regression tests
        run: python -m unittest tools.tests.test_validate_headless_ui_tests

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore App tests
        run: dotnet restore tests/CalcNova.App.Tests/CalcNova.App.Tests.csproj

      - name: Run App and headless UI tests
        run: dotnet test tests/CalcNova.App.Tests/CalcNova.App.Tests.csproj --configuration Release --no-restore
