name: Graph Surface Validate

on:
  push:
    branches: [main]
    paths:
      - "src/CalcNova.App/Controls/GraphPlotControl.cs"
      - "src/CalcNova.App/Views/MainView.axaml.cs"
      - "src/CalcNova.App/ViewModels/GraphingViewModel.cs"
      - "tests/CalcNova.App.Tests/MainViewHeadlessTests.cs"
      - "tools/validate_graph_surface.py"
      - "tools/tests/test_validate_graph_surface.py"
      - "docs/GRAPH_INTERACTION.md"
      - ".github/workflows/graph-surface-validate.yml"
  pull_request:
    paths:
      - "src/CalcNova.App/Controls/GraphPlotControl.cs"
      - "src/CalcNova.App/Views/MainView.axaml.cs"
      - "src/CalcNova.App/ViewModels/GraphingViewModel.cs"
      - "tests/CalcNova.App.Tests/MainViewHeadlessTests.cs"
      - "tools/validate_graph_surface.py"
      - "tools/tests/test_validate_graph_surface.py"
      - "docs/GRAPH_INTERACTION.md"
      - ".github/workflows/graph-surface-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate shared graph-surface contracts
        run: python tools/validate_graph_surface.py .

      - name: Run graph-surface validator tests
        run: python -m unittest tools.tests.test_validate_graph_surface
