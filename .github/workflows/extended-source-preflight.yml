name: Extended Source Preflight

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "docs/**"
      - ".github/workflows/**"
      - "PROJECT_STATE.md"
      - "what_changed.md"
      - "CHANGELOG.md"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "docs/**"
      - ".github/workflows/**"
      - "PROJECT_STATE.md"
      - "what_changed.md"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run integrated source preflight
        run: python tools/release_preflight.py

      - name: Reject incomplete implementation markers
        run: python tools/validate_incomplete_code.py .

      - name: Run incomplete-code validator tests
        run: python -m unittest tools.tests.test_validate_incomplete_code
