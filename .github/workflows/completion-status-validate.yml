name: CalcNova 2.8.03 Completion Validate

on:
  push:
    branches: [main]
    paths:
      - "Directory.Build.props"
      - "README.md"
      - "PROJECT_STATE.md"
      - "CHANGELOG.md"
      - "what_changed.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "CONTRIBUTING.md"
      - "docs/README.md"
      - "docs/FEATURES.md"
      - "docs/ROADMAP.md"
      - "docs/FINAL_SOURCE_AUDIT_2026-08-19.md"
      - "docs/VERSIONING.md"
      - "docs/RELEASE.md"
      - "docs/RELEASE_READINESS_CHECKLIST.md"
      - "docs/PLATFORM_SUPPORT.md"
      - "docs/SOURCE_PREFLIGHT.md"
      - "src/CalcNova.App/ViewModels/AboutViewModel.cs"
      - "src/CalcNova.App/Views/MainView.BivariateStatistics.cs"
      - "src/CalcNova.Android/CalcNova.Android.csproj"
      - "src/CalcNova.iOS/CalcNova.iOS.csproj"
      - "packaging/linux/in.sanskar.calcnova.metainfo.xml"
      - "tests/CalcNova.App.Tests/AboutReleaseIdentityTests.cs"
      - "tests/CalcNova.App.Tests/AboutReleaseIdentityHeadlessTests.cs"
      - "tools/validate_completion_status.py"
      - "tools/validate_packaging_metadata.py"
      - "tools/tests/test_validate_completion_status.py"
      - "tools/tests/test_validate_packaging_metadata.py"
      - ".github/workflows/completion-status-validate.yml"
  pull_request:
    paths:
      - "Directory.Build.props"
      - "README.md"
      - "PROJECT_STATE.md"
      - "CHANGELOG.md"
      - "what_changed.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "CONTRIBUTING.md"
      - "docs/README.md"
      - "docs/FEATURES.md"
      - "docs/ROADMAP.md"
      - "docs/FINAL_SOURCE_AUDIT_2026-08-19.md"
      - "docs/VERSIONING.md"
      - "docs/RELEASE.md"
      - "docs/RELEASE_READINESS_CHECKLIST.md"
      - "docs/PLATFORM_SUPPORT.md"
      - "docs/SOURCE_PREFLIGHT.md"
      - "src/CalcNova.App/ViewModels/AboutViewModel.cs"
      - "src/CalcNova.App/Views/MainView.BivariateStatistics.cs"
      - "src/CalcNova.Android/CalcNova.Android.csproj"
      - "src/CalcNova.iOS/CalcNova.iOS.csproj"
      - "packaging/linux/in.sanskar.calcnova.metainfo.xml"
      - "tests/CalcNova.App.Tests/AboutReleaseIdentityTests.cs"
      - "tests/CalcNova.App.Tests/AboutReleaseIdentityHeadlessTests.cs"
      - "tools/validate_completion_status.py"
      - "tools/validate_packaging_metadata.py"
      - "tools/tests/test_validate_completion_status.py"
      - "tools/tests/test_validate_packaging_metadata.py"
      - ".github/workflows/completion-status-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completion-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate completed product status
        run: python tools/validate_completion_status.py .

      - name: Validate release/package identity
        run: python tools/validate_packaging_metadata.py .

      - name: Run completion-status validator tests
        run: python -m unittest tools.tests.test_validate_completion_status

      - name: Run packaging validator tests
        run: python -m unittest tools.tests.test_validate_packaging_metadata
